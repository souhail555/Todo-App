<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="pageTitle">📋 Task Manager</title>
  <!-- Google Fonts: Inter (English) + Tajawal (Arabic) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <main class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-top">
        <div class="header-title">
          <i class="fa-solid fa-list-check icon-brand"></i>
          <h1 data-i18n="appTitle">Task Manager</h1>
        </div>
        <div class="header-actions">
          <!-- Language Toggle -->
          <button id="langToggleBtn" class="lang-toggle-btn" title="Switch language" aria-label="Switch language">
            <i class="fa-solid fa-globe"></i>
            <span id="langLabel">العربية</span>
          </button>
          <!-- Dark Mode Toggle -->
          <button id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Dark/Light Mode" aria-label="Toggle theme">
            <i class="fa-solid fa-moon theme-icon" id="themeIcon"></i>
          </button>
        </div>
      </div>
      <p class="subtitle" id="currentDate"></p>
    </header>

    <!-- Task Input Form -->
    <section class="input-section">
      <form id="taskForm" class="input-wrapper">
        <input
          type="text"
          id="taskInput"
          placeholder="Add a new task..."
          autocomplete="off"
          aria-label="New task input"
          data-i18n-placeholder="inputPlaceholder"
        />
        <button type="submit" id="addBtn" class="btn btn-primary" title="Add Task">
          <i class="fa-solid fa-plus"></i>
          <span data-i18n="addBtn">Add</span>
        </button>
      </form>
      <!-- Extra options: priority, category, due date -->
      <div class="task-options">
        <div class="option-field">
          <i class="fa-solid fa-flag"></i>
          <select id="prioritySelect" aria-label="Priority">
            <option value="high" data-i18n="priorityHigh">High</option>
            <option value="medium" selected data-i18n="priorityMedium">Medium</option>
            <option value="low" data-i18n="priorityLow">Low</option>
          </select>
        </div>
        <div class="option-field">
          <i class="fa-solid fa-tag"></i>
          <select id="categorySelect" aria-label="Category">
            <option value="personal" selected data-i18n="catPersonal">Personal</option>
            <option value="work" data-i18n="catWork">Work</option>
            <option value="shopping" data-i18n="catShopping">Shopping</option>
            <option value="health" data-i18n="catHealth">Health</option>
            <option value="other" data-i18n="catOther">Other</option>
          </select>
        </div>
        <div class="option-field option-date">
          <i class="fa-regular fa-calendar"></i>
          <input type="date" id="dueDateInput" aria-label="Due date" />
        </div>
      </div>
      <p class="drag-hint" data-i18n="dragHint">Tip: drag tasks to reorder them</p>
    </section>

    <!-- Filter & Statistics -->
    <section class="controls-section">
      <div class="filter-group" role="tablist">
        <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true" data-i18n="filterAll">All</button>
        <button class="filter-btn" data-filter="active" role="tab" aria-selected="false" data-i18n="filterActive">Active</button>
        <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false" data-i18n="filterCompleted">Completed</button>
      </div>
      <div class="task-stats">
        <span class="task-counter" id="taskCounter">0 tasks left</span>
        <span class="total-counter" id="totalCounter">(0 total)</span>
      </div>
    </section>

    <!-- Completion Progress Bar -->
    <section class="progress-section">
      <div class="progress-info">
        <i class="fa-solid fa-chart-simple"></i>
        <span id="progressText">0% completed</span>
      </div>
      <div
        class="progress-bar"
        id="progressBar"
        role="progressbar"
        aria-label="Task completion progress"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </section>

    <!-- Task List -->
    <section class="list-section">
      <ul id="taskList" class="task-list" aria-label="Task list"></ul>
      <div id="emptyState" class="empty-state">
        <i class="fa-regular fa-clipboard"></i>
        <p id="emptyStateText" data-i18n="emptyNoTasks">No tasks yet. Enjoy your day!</p>
      </div>
    </section>

    <!-- Actions Footer -->
    <footer class="app-footer">
      <button id="clearCompletedBtn" class="btn btn-outline" title="Clear Completed Tasks">
        <i class="fa-solid fa-check-double"></i>
        <span data-i18n="clearCompleted">Clear Completed</span>
      </button>
      <button id="clearAllBtn" class="btn btn-danger" title="Clear All Tasks">
        <i class="fa-solid fa-trash"></i>
        <span data-i18n="clearAll">Clear All</span>
      </button>
    </footer>
  </main>

  <!-- Confetti container (celebration when all tasks done) -->
  <div id="confettiContainer" class="confetti-container" aria-hidden="true"></div>

  <script src="script.js?v=5"></script>
</body>
</html>
